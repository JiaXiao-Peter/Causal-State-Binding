[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freewill-v3"
version = "0.1.0"
description = "Dual-track Narratives discovery and lesionable LLM agent scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "nibabel>=5.2",
  "nilearn>=0.10",
  "pybids>=0.17",
  "pyarrow>=15.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "snakemake>=8.0",
  "transformers>=4.40",
  "datasets>=2.19",
  "sentence-transformers>=2.7",
  "spacy>=3.7",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
freewill = "freewill.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
